    <style>
/* Classic 2000s Web Aesthetics */

body {
background-color: #e5e5e5;
font-family: Verdana, Geneva, Tahoma, sans-serif;
font-size: 12px;
color: #000;
margin: 0 auto;
padding: 20px;
}

a {
color: #003399;
text-decoration: none;
font-weight: bold;
}

a:hover {
text-decoration: underline;
color: #ff007f;
}

/* Outer Wrapper */

.container, .post {
margin: 0 auto;
background-color: #ffffff;
border: 2px solid #003399;
padding: 30px;
box-shadow: 4px 4px 0px #888888;
border-radius: 60px;
}

.post {
  margin-top: 20px;
}

.posts{
  margin: 0 auto;
background-color: #ffffff;
border: 2px solid #003399;
padding: 30px;
box-shadow: 4px 4px 0px #888888;
border-radius: 60px;
}

/* Header Banner */

header {
background-color: #003399;
color: #ffffff;
padding: 15px;
text-align: center;
margin-bottom: 15px;
border: 1px dashed #ffffff;
align: center;
}

header h1 {
margin: 0;
font-size: 24px;
font-family: 'Comic Sans MS', 'Arial', sans-serif;
letter-spacing: 2px;
}

header p {

margin: 5px 0 0 0;

font-style: italic;

}
.sidebar {
width: 100px;
height: 100%;
position: fixed;
overflow: auto;
padding: 0;
margin: 0;
}

.sidebar a {
  background-color: #99007F;
display: block;
padding: 16px;
text-decoration: none;
color: white;
}

 .sidebar a:hover {
background-color: #94F4F4;
color: black;
}

 .post-author {
  font-style: italic;
  margin-bottom: 10px;
}

 .post-feeling {
  margin: 10px 0;
  color: #4267b2;
  font-weight: bold;
}

#feeling {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 9px;
  font: inherit;
}

input[type="hidden"]#feeling {
  display: none !important;
}

.mood-label {
  display: block;
  margin: 10px 0 6px;
  font-weight: bold;
}

.mood-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0 14px;
}

#postForm .mood-choice {
  display: flex;
  flex: 1 1 82px;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 68px;
  padding: 7px 5px;
  border: 1px solid rgba(77, 176, 199, .35);
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(255,255,255,.98), rgba(214,247,251,.9));
  box-shadow: inset 0 1px 0 #fff, 0 2px 5px rgba(34, 137, 163, .16);
  color: #17445b;
  text-shadow: none;
}

#postForm .mood-choice:hover,
#postForm .mood-choice[aria-pressed="true"] {
  border-color: #28a9c7;
  background: linear-gradient(180deg, #fff, #b8f4f8);
  color: #17445b;
}

#postForm .mood-choice[aria-pressed="true"] {
  outline: 2px solid rgba(34, 177, 202, .35);
  box-shadow: inset 0 1px 0 #fff, 0 0 0 2px rgba(255,255,255,.85), 0 3px 8px rgba(34, 137, 163, .24);
}

#postForm .mood-choice span {
  font-size: 11px;
}

.mood-icon {
  display: block;
  width: 32px;
  height: 32px;
  filter: drop-shadow(0 2px 2px rgba(31, 117, 143, .2));
}

/* Give Tired and Excited the larger feature illustrations. */
#postForm .mood-choice[data-mood="tired"] .mood-icon,
#postForm .mood-choice[data-mood="excited"] .mood-icon {
  width: 46px;
  height: 46px;
}

.mood-art-defs {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

 .post-feeling {
  display: flex;
  align-items: center;
  gap: 7px;
}

.post-reactions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
}

.post-reactions button {
  padding: 6px 10px;
}

 .post-reactions button[aria-pressed="true"] {
  outline: 2px solid rgba(8, 117, 168, .45);
}

.post-reaction-emoji {
  min-width: 42px;
}

.post-comments {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid rgba(8, 117, 168, .2);
}

.post-comment {
  margin: 8px 0;
  padding: 9px 12px;
  border: 1px solid rgba(255, 255, 255, .95);
  border-radius: 12px;
  background: linear-gradient(150deg, rgba(255, 255, 255, .98), rgba(223, 248, 255, .94) 48%, rgba(189, 235, 247, .9));
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .95), 0 3px 8px rgba(36, 119, 148, .18);
  overflow-wrap: anywhere;
}

.post-comment-meta {
  margin-top: 4px;
  color: #4e6670;
  font-size: 11px;
}

.post-comment-form {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin-top: 10px;
}

.post-comment-form textarea {
  flex: 1;
  min-height: 40px;
  resize: vertical;
}

.post-comment-form button {
  margin-top: 0;
}

@media (max-width: 500px) {
  .post-comment-form {
    flex-direction: column;
  }

  .post-comment-form textarea,
  .post-comment-form button {
    width: 100%;
  }
}


.post-feeling .mood-icon {
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
}

.delete-post {
  display: block;
  margin-top: 12px;
  padding: 8px 12px;
  color: white;
  background-color: #990033;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
}

 img {
  max-width: 100%;
  max-height: 100%;
}

    <script>     
      
console.log("SCRIPT LOADED");
      
const supabaseUrl = "https://btrycwhwyddoutgmzilo.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0cnljd2h3eWRkb3V0Z216aWxvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5Mjg3ODUsImV4cCI6MjEwNjUwNDc4NX0.BgV-WY5BtV-HsKqa0HqhNRSRo0zzOuYJYF1ZliXrRqs";
const supabase = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);

       const form = document.getElementById("postForm");
const postsContainer = document.getElementById("posts");
const imageUpload = document.getElementById("imageUpload");
const preview = document.getElementById("preview");
const feelingInput = document.getElementById("feeling");
const moodChoices = document.querySelectorAll(".mood-choice");

          (async () => {
  const {
    data: { session }
  } = await supabase.auth.getSession();

  if (!session) {
    window.location.href = "index.html";
  }
})();
          
moodChoices.forEach(button => {
    button.addEventListener("click", () => {
        const mood = button.dataset.mood;
        feelingInput.value = feelingInput.value === mood ? "" : mood;
        moodChoices.forEach(choice => {
            choice.setAttribute("aria-pressed", String(choice.dataset.mood === feelingInput.value));
        });
    });
});

          imageUpload.addEventListener("change", () => {
    const file = imageUpload.files[0];

    if (!file) return;

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
});

          
async function getCurrentUser() {
    const { data: { user } } = await supabase.auth.getUser();
    return user;
}

async function loadPosts() {
    postsContainer.innerHTML = "";

    const { data, error } = await supabase
        .from("posts")
        .select(`*, profiles!posts_author_id_fkey(username)`)
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        return;
    }

    const user = await getCurrentUser();

    data.forEach(post => {
        const card = document.createElement("div");
        card.className = "post";

        const username = post.profiles?.username || "Unknown User";

        card.innerHTML = `
            <h3>${post.title}</h3>
            <div class="post-author">Posted by ${username}</div>
            <p>${post.content}</p>
            ${post.feeling ? `<div class="post-feeling">Feeling ${post.feeling}</div>` : ""}
            ${post.image_url ? `<img src="${post.image_url}" alt="Post image">` : ""}
        `;

        if (user && user.id === post.author_id) {
            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-post";
            deleteButton.textContent = "Delete Post";

            deleteButton.onclick = async () => {
                const { error } = await supabase
                    .from("posts")
                    .delete()
                    .eq("id", post.id);

                if (error) {
                    alert(error.message);
                    return;
                }

                loadPosts();
            };

            card.appendChild(deleteButton);
        }

        postsContainer.appendChild(card);
    });
}
        

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const user = await getCurrentUser();

    if (!user) {
        alert("Please log in first.");
        return;
    }


    let imageUrl = "";

    if (imageUpload.files[0]) {
        const file = imageUpload.files[0];
        const fileName = crypto.randomUUID() + "-" + file.name;

        const upload = await supabase.storage
            .from("images")
            .upload(fileName, file);

        if (!upload.error) {
            imageUrl = supabase.storage
                .from("images")
                .getPublicUrl(fileName)
                .data.publicUrl;
        }
    }

    const { error } = await supabase
        .from("posts")
        .insert({
            author_id: user.id,
            title: document.getElementById("title").value,
            content: document.getElementById("content").value,
            feeling: feelingInput.value,
            image_url: imageUrl
        });

    if (error) {
        alert(error.message);
        return;
    }

    form.reset();
    loadPosts();
});

      loadPosts();

    </script>
